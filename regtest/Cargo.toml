[package]
name = "haystack-regtest"
version = "0.1.0"
edition = "2021"
publish = false
description = "A real wallet history on a local regtest chain (bitcoind and electrs, via bdk_testenv), for testing haystack-electrum against a real Electrum server."

[dependencies]
bdk_testenv = "0.13.1"
bdk_wallet = { version = "2.1.0", default-features = false, features = ["std"] }
bdk_electrum = "0.23.2"
electrum-client = { version = "0.24.1", default-features = false, features = ["proxy", "use-rustls"] }
haystack-electrum = { path = "../haystack-electrum" }
serde_json = "1"
rand = "0.8"
