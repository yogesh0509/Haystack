[package]
name = "haystack-capture"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "Run stock bdk_wallet full scans against an Electrum endpoint and record what the wallet itself says it queried."

[dependencies]
bdk_wallet = { version = "2.1.0", default-features = false, features = ["std"] }
bdk_electrum = "0.23.2"
serde_json = "1"
